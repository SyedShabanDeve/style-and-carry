<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />

    <title>Style &amp; Carry — Wallets, watches &amp; more</title>
    <meta
      name="description"
      content="Wallets, watches and clothing for men and women in Pakistan. Cash on delivery nationwide, free delivery over Rs 2,500."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Style &amp; Carry — Wallets, watches &amp; more" />
    <meta
      property="og:description"
      content="Wallets, watches and more. Cash on delivery all over Pakistan."
    />
    <meta property="og:image" content="/img/metro-trifold-1.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint so the page never flashes white.
      try {
        var t = localStorage.getItem('sc_theme');
        if (t) document.documentElement.dataset.theme = t;
        else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Style &amp; Carry needs JavaScript. You can also order on WhatsApp at 0307 9415512.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
